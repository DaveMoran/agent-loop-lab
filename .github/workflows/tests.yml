name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Step 5's tests drive a real MCP client, so the agent extra (which holds the
      # pinned mcp SDK, and anyio through it) is needed as well as dev.
      - run: pip install -e ".[agent,dev]"

      # No API keys are configured on purpose: the tests must pass offline.
      - run: python -m pytest -q
