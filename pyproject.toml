[project]
name = "agent-loop-lab"
version = "0.1.0"
description = "A from-scratch agent loop, plus a tiny shop app with injectable faults to point it at"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
agent = ["openai", "anthropic", "httpx", "python-dotenv"]
dev = ["pytest"]

[tool.setuptools]
packages = ["shop", "agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
